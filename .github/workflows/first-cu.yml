name: First CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-files:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Display repository files
        run: ls -la

      - name: Verify important files
        run: |
          test -f README.md
          test -f DEVOPS-NOTES.md
          echo "All required files are available."

      - name: Display success message
        run: echo "My first GitHub Actions CI workflow completed successfully!"
